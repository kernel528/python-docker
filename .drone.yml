kind: pipeline
type: docker
name: python-rootless-image-validation

node:
  ci-role: rootless-image-smoke
  platform: linux-amd64

trigger:
  repo:
    - kernel528/python-docker
  branch:
    - '3.14'
    - main
  event:
    - pull_request
    - push
    - custom

steps:
  - name: build-and-smoke
    image: docker:27-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: "0"
    commands:
      - scripts/ci-rootless-python-smoke.sh
    volumes:
      - name: podman-socket
        path: /var/run/docker.sock

volumes:
  - name: podman-socket
    host:
      path: /run/user/1001/podman/podman.sock

---

kind: pipeline
type: docker
name: python-maintenance-candidate

trigger:
  repo:
    - kernel528/python-docker
  branch:
    - '3.14'
  event:
    - push

services:
  - name: docker
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - name: candidate-dockersock
        path: /var/run

steps:
  - name: build-and-smoke-candidate
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHON_IMAGE_REPO: kernel528/python
    volumes:
      - name: candidate-dockersock
        path: /var/run
    commands:
      - scripts/ci-build-python-candidate.sh

  - name: publish-candidate
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHON_IMAGE_REPO: kernel528/python
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    volumes:
      - name: candidate-dockersock
        path: /var/run
    commands:
      - scripts/ci-publish-python-candidate.sh

  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

volumes:
  - name: candidate-dockersock
    temp: {}

---

kind: pipeline
type: docker
name: main-python-amd64

trigger:
  repo:
    - kernel528/python-docker
  branch:
    - main
  event:
    - push

steps:
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

---

kind: pipeline
type: docker
name: python-immutable-release

# Release tags are manually created from a reviewed main commit. Drone tag
# events are not branch-associated; the build script validates tag metadata.
trigger:
  repo:
    - kernel528/python-docker
  event:
    - tag

services:
  - name: docker
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - name: release-dockersock
        path: /var/run

steps:
  - name: build-and-smoke-release
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHON_IMAGE_REPO: kernel528/python
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-build-python-release.sh

  - name: check-immutable-tag-unused
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHON_IMAGE_REPO: kernel528/python
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-check-python-release-tag-unused.sh

  - name: publish-immutable-release
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHON_IMAGE_REPO: kernel528/python
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-publish-python-release.sh

  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

volumes:
  - name: release-dockersock
    temp: {}
