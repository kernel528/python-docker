kind: pipeline
type: docker
name: build-versioned-image

trigger:
  branch:
    - '3.14'
  event:
    - pull_request

# Build the docker image for amd64 architecture
steps:
  - name: version-docker-image-build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      platforms:
        - linux/amd64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: kernel528/python
      tags:
        - pr-${DRONE_PULL_REQUEST}-build-${DRONE_BUILD_NUMBER}
      dry_run: true

  # Slack notification
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

---
kind: pipeline
type: docker
name: build-tagged-image

trigger:
  event:
    - tag

# Build the docker image for the tagged release
steps:
  - name: tag-docker-image-build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: kernel528/python
      tags:
        - ${DRONE_TAG}
        - latest

  # Slack notification
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts
